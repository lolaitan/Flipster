[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.13"]
build-backend = "scikit_build_core.build"

[project]
name = "flipster"
version = "2.0.0"
description = "Flipbook in-betweening with dense pyramidal Lucas-Kanade optical flow on CPU (C++/OpenMP) and CUDA"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "lolaitan" }]
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "opencv-python-headless>=4.8",
  "pillow>=10",
]

[project.optional-dependencies]
server = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "python-multipart>=0.0.9",
  "imageio>=2.34",
  "imageio-ffmpeg>=0.5",
]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5"]

[tool.scikit-build]
cmake.version = ">=3.20"
wheel.packages = ["python/flipster"]
build-dir = "build/{wheel_tag}"

[tool.scikit-build.cmake.define]
FLIPSTER_BUILD_PYTHON = "ON"
FLIPSTER_BUILD_TESTS = "OFF"
FLIPSTER_ENABLE_CUDA = { env = "FLIPSTER_ENABLE_CUDA", default = "AUTO" }

[tool.pytest.ini_options]
testpaths = ["tests", "server/tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E731"]
