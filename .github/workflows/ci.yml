name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: C++ core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DFLIPSTER_ENABLE_CUDA=OFF -DFLIPSTER_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

  cuda:
    name: CUDA compile check
    runs-on: ubuntu-latest
    container: nvidia/cuda:12.6.3-devel-ubuntu24.04
    steps:
      - run: apt-get update && apt-get install -y --no-install-recommends cmake ninja-build g++ git ca-certificates
      - uses: actions/checkout@v4
      - name: Build CUDA engine + tests (hosted runners have no GPU, so tests are not run)
        run: |
          cmake -S . -B build -G Ninja -DFLIPSTER_ENABLE_CUDA=ON -DFLIPSTER_BUILD_TESTS=ON
          cmake --build build

  python:
    name: Python ${{ matrix.python }} package + API
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install (builds the C++ extension)
        run: pip install ".[server,dev]"
      - name: Lint
        if: matrix.python == '3.12'
        run: |
          ruff check python server tests bench eval docs notebooks
          ruff format --check python server tests bench eval docs notebooks
      - name: Test (NumPy reference + C++ engine + API)
        run: pytest

  web:
    name: Web app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    name: Docker image (CPU)
    runs-on: ubuntu-latest
    needs: [python, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: false
          tags: flipster:ci
